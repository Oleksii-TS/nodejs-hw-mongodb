tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact for the authenticated user. Optionally upload a photo
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
          - contactType
        properties:
          name:
            type: string
            example: Dmitry Tils
          phoneNumber:
            type: string
            example: '+3800000000019'
          email:
            type: string
            example: Dmitry@example.com
          contactType:
            type: string
            enum: [work, home, personal]
            example: work
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
            description: Optional contact photo file
responses:
  '201':
    $ref: ../../components/responses/contacts/201_createContact.yaml
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
