type: object
required:
  - name
  - email
  - _Id
properties:
  name:
    description: "User's name"
    type: string
    example: 'Olga Nikonchuk'
  email:
    description: "User's email"
    type: string
    example: 'Nikonchuk@example.com'
  _Id:
    description: "User's id"
    type: string
    example: 68f36060d496994faccbb153
  createdAt:
    type: string
    format: date-time
    example: '2025-10-18T09:39:44.623Z'
  updatedAt:
    type: string
    format: date-time
    example: '2025-10-18T09:39:44.623Z'
