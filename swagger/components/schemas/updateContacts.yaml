type: object
properties:
  name:
    description: "Contact's name"
    type: string
    example: 'Dmitry Tils'
  phoneNumber:
    description: "Contact's number"
    type: string
    example: '+3800000000019'
  email:
    description: "Contact's email"
    type: string
    example: 'Dmitry@example.com'
  isFavourite:
    description: "Contact's favourite"
    type: boolean
    default: false
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  photo:
    type: string
    format: binary
    description: Optional contact photo file
