description: Contact not found
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: NotFoundError
        data:
          type: object
          example:
            { 'message': 'Contact not found with id 68f35a0bd496994faccbb13d!' }
